# fanctrl configuration
# Controls chassis fan(s) on pwm header(s) from amdgpu temperature(s).
#
# Each enabled GPU sensor has its own piecewise-linear curve "temp_c:pwm"
# pairs (sorted, at least 2 points). Below the first point -> first pwm,
# above the last point -> last pwm, in between -> linear interpolation.
# Every fan is driven at the MAXIMUM of all (GPU, sensor) targets, so any
# sensor on any GPU exceeding its limits bumps the speed.

[main]
# polling interval in seconds (higher = calmer, slower reaction)
interval      = 5

# max pwm change per cycle: fast ramp-up (safety), slow ramp-down (no hunting)
ramp_up_step  = 64
ramp_down_step = 8

# anti-hunting: while a fan sits at its baseline duty (min_pwm, where it may
# stall), it is only spun up when the target exceeds min_pwm + spin_up_margin.
# Small temp bumps that would otherwise restart a stalled fan are ignored -
# no more stall -> slight warmup -> restart -> cool down -> stall cycling.
spin_up_margin = 48

# fail-safe: if NO temperature can be read (incl. GPU unplugged / driver not
# loaded), drive all fans here and keep polling for the GPU to return
on_sensor_error_pwm = 255

# warn if measured fan rpm drops below this while pwm is applied (0 = off).
# Arctic P12 Pro: minimum operating speed is 600 rpm
fan_rpm_min   = 600

# log a status line with all temps/pwm/rpm every N cycles (0 = off)
status_every  = 6

log_level     = info

# ---- fans ------------------------------------------------------------------
# [fan1], [fan2], ... one section per fan.
# Fans with the same non-empty 'group' are synced: one shared pwm target is
# computed and written identically to all members (e.g. a fan duct where both
# fans must spin at the same speed). RPM monitoring stays per-fan.

[fan1]
pwm_path    = /sys/class/hwmon/hwmon2/pwm2
enable_path = /sys/class/hwmon/hwmon2/pwm2_enable
rpm_path    = /sys/class/hwmon/hwmon2/fan2_input
# Arctic P12 Pro coasts down below ~pwm 72 (below its 600 rpm minimum it
# can't hold speed). Baseline pwm 72 ~= 900-1000 rpm: the fan ALWAYS runs,
# so it can never drop into the coast-down/restart cycling zone.
min_pwm     = 72
max_pwm     = 255
group       =           # empty = controlled individually

# ---- GPUs -------------------------------------------------------------------
# [gpu0], [gpu1], ... one section per GPU. hwmon is auto-assigned in order
# (card0, card1, ...); set 'hwmon = /sys/class/hwmon/hwmonN' to pin one.
# A sensor curve is only active when its *_points line is present.

# NOTE: curve values below the fan's min_pwm (72) are clamped to it -
# they only matter for where the spin-up hysteresis threshold lands.

[gpu0]
# edge runs a few degrees cooler than junction; be more conservative
edge_points = 45:32, 65:192, 80:255
# requirement: at/above 70 C junction -> 100 % pwm
junction_points = 45:32, 60:192, 70:255
# hbm/vid memory: allow more headroom (crit ~94 C)
mem_points = 45:32, 70:192, 90:255
